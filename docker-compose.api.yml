services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "1"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 12G
    networks:
      - api_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: cpu-runner
    container_name: api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - fastembed_cache:/app/model_cache
    environment:
      DB_URL: ${DB_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
      QDRANT_BATCH_SIZE: ${QDRANT_BATCH_SIZE}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      FASTEMBED_CACHE_PATH: /app/model_cache
      ONNXRUNTIME_PROVIDER: ${ONNXRUNTIME_PROVIDER:-CPUExecutionProvider}
    depends_on:
      - qdrant
    networks:
      - api_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  embedding_worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: cpu-runner
    container_name: embedding_worker
    restart: always
    env_file:
      - .env
    volumes:
      - fastembed_cache:/app/model_cache
    environment:
      DB_URL: ${DB_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
      QDRANT_BATCH_SIZE: ${QDRANT_BATCH_SIZE}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      FASTEMBED_CACHE_PATH: /app/model_cache
      ONNXRUNTIME_PROVIDER: ${ONNXRUNTIME_PROVIDER:-CPUExecutionProvider}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-5}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
    depends_on:
      - qdrant
    networks:
      - api_network
    command: python -m src.api.workers.embedding_worker
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  graph_worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: cpu-runner
    # container_name: graph_worker
    restart: always
    env_file:
      - .env
    volumes:
      - fastembed_cache:/app/model_cache
    environment:
      DB_URL: ${DB_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
      QDRANT_BATCH_SIZE: ${QDRANT_BATCH_SIZE}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      FASTEMBED_CACHE_PATH: /app/model_cache
      GRAPH_CONCURRENCY: ${GRAPH_CONCURRENCY:-15}
      GRAPH_BATCH_SIZE: ${GRAPH_BATCH_SIZE:-50}
    depends_on:
      - qdrant
    networks:
      - api_network
    command: python -m src.api.workers.graph_extractor_worker
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  api_network:
    driver: bridge

volumes:
  qdrant_data:
  fastembed_cache:
