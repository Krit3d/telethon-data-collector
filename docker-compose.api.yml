services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tg_parser_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - api_network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: tg_parser_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DB_URL: ${DB_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
      QDRANT_BATCH_SIZE: ${QDRANT_BATCH_SIZE}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT}
      LOG_LEVEL: ${LOG_LEVEL}
    networks:
      - api_network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  api_network:
    driver: bridge

volumes:
  qdrant_data:
