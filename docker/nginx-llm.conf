events {
    worker_connections 1024;
}
http {
    server {
        listen 8080;
        
        location / {
            proxy_pass https://api.deepseek.com/;
            proxy_set_header Host api.deepseek.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}