<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorFlow — CRM для инфлюенс-маркетинга</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var isInIframe = window.self !== window.top;
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              var theme = event.data.theme;
              if (theme === "light" || theme === "dark") applyThemeToDOM(theme);
            }
          });
        } else {
          applyThemeToDOM("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
