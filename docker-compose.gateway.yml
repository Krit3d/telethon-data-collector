name: telethon-gateway

services:
  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - api_network
      - crm-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  api_network:
    name: telethon-api_api_network
    external: true
  crm-network:
    name: creatorflow-network
    external: true
