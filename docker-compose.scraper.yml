services:
  db:
    image: apache/age@sha256:4241e2d8bb86a6b2ea44e9ad06c73856e12b209de295124603a599dd7feb70eb
    container_name: tg_parser_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tg_parser}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    command: >
      postgres -c shared_preload_libraries=age
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tg_parser}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - scraper_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  crawler:
    build:
      context: .
      dockerfile: docker/scraper/Dockerfile
    container_name: tg_parser_crawler
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tg_parser}
      CRAWLER_DELAY_MIN: ${CRAWLER_DELAY_MIN:-45}
      CRAWLER_DELAY_MAX: ${CRAWLER_DELAY_MAX:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      SESSION_DIR: /app/sessions/crawler
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.parser.crawler
    volumes:
      - .:/app
      - ./sessions:/app/sessions
      - ./proxies.txt:/app/proxies.txt
    networks:
      - scraper_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  parser:
    build:
      context: .
      dockerfile: docker/scraper/Dockerfile
    container_name: tg_parser_app
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tg_parser}
      POSTS_LIMIT: ${POSTS_LIMIT:-10}
      CONCURRENCY: ${CONCURRENCY:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      SESSION_DIR: /app/sessions/parser
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.parser.parser
    volumes:
      - ./sessions:/app/sessions
      - ./proxies.txt:/app/proxies.txt
    networks:
      - scraper_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  scraper_network:
    driver: bridge

volumes:
  postgres_data:
    name: tg_parser_pg18_final
