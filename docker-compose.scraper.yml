services:
  db:
    container_name: tg_parser_db
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tg_parser}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${TS_IP_SCRAPER}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tg_parser}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    command: postgres -c listen_addresses='*' -c max_connections=300
    shm_size: 1gb
    networks:
      - scraper_network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  crawler:
    container_name: tg_parser_crawler
    image: tg_parser_crawler_base:latest
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tg_parser}
      CRAWLER_DELAY_MIN: ${CRAWLER_DELAY_MIN:-45}
      CRAWLER_DELAY_MAX: ${CRAWLER_DELAY_MAX:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      SESSION_DIR: /app/sessions/crawler
    volumes:
      - .:/app
      - ./sessions:/app/sessions
      - ./proxies.txt:/app/proxies.txt
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.parser.telegram.crawler
    networks:
      - scraper_network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  parser:
    container_name: tg_parser_app
    build:
      context: .
      dockerfile: docker/scraper/Dockerfile
    image: tg_parser_crawler_base:latest
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tg_parser}
      POSTS_LIMIT: ${POSTS_LIMIT:-10}
      CONCURRENCY: ${CONCURRENCY:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      SESSION_DIR: /app/sessions/parser
    volumes:
      - .:/app
      - ./sessions:/app/sessions
      - ./proxies.txt:/app/proxies.txt
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.parser.telegram.parser
    networks:
      - scraper_network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  creators_instagram:
    container_name: tg_parser_creators_instagram
    image: tg_parser_crawler_base:latest
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tg_parser}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - ./sessions:/app/sessions
      - ./proxies.txt:/app/proxies.txt
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.parser.creators.coordinator --platform INSTAGRAM
    networks:
      - scraper_network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  creators_tiktok:
    container_name: tg_parser_creators_tiktok
    image: tg_parser_crawler_base:latest
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tg_parser}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - ./sessions:/app/sessions
      - ./proxies.txt:/app/proxies.txt
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.parser.creators.coordinator --platform TIKTOK
    networks:
      - scraper_network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  creators_threads:
    container_name: tg_parser_creators_threads
    image: tg_parser_crawler_base:latest
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tg_parser}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - ./sessions:/app/sessions
      - ./proxies.txt:/app/proxies.txt
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.parser.creators.coordinator --platform THREADS
    networks:
      - scraper_network
