name: telethon-crm

services:
  twenty-db:
    image: postgres:16-alpine
    restart: always
    env_file: [ .env ]
    environment:
      POSTGRES_USER: ${TWENTY_PG_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_PG_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${TWENTY_PG_DB:-twenty}
    volumes: [ twenty_pg_data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-twenty} -d $${POSTGRES_DB:-twenty}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ crm-network ]
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }
  twenty-redis:
    image: redis:7-alpine
    restart: always
    env_file: [ .env ]
    volumes: [ twenty_redis_data:/data ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ crm-network ]
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }
  twenty-server:
    image: twentycrm/twenty:latest
    restart: always
    env_file: [ .env ]
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${TWENTY_PG_USER:-twenty}:${TWENTY_PG_PASSWORD:-change_me_strong_password}@twenty-db:5432/${TWENTY_PG_DB:-twenty}
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3000}
      APP_SECRET: ${TWENTY_APP_SECRET:-change_me_to_a_long_random_string}
      REDIS_URL: ${TWENTY_REDIS_URL:-redis://twenty-redis:6379}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: .local-storage
    ports:
      - "${INTERNAL_BIND_ADDR:-127.0.0.1}:${TWENTY_PORT:-3000}:3000"
    volumes:
      - twenty_storage_data:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-db: { condition: service_healthy }
      twenty-redis: { condition: service_healthy }
    networks: [ crm-network ]
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }
  twenty-worker:
    image: twentycrm/twenty:latest
    restart: always
    env_file: [ .env ]
    environment:
      PG_DATABASE_URL: postgres://${TWENTY_PG_USER:-twenty}:${TWENTY_PG_PASSWORD:-change_me_strong_password}@twenty-db:5432/${TWENTY_PG_DB:-twenty}
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3000}
      APP_SECRET: ${TWENTY_APP_SECRET:-change_me_to_a_long_random_string}
      REDIS_URL: ${TWENTY_REDIS_URL:-redis://twenty-redis:6379}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: .local-storage
    volumes:
      - twenty_storage_data:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-db: { condition: service_healthy }
      twenty-redis: { condition: service_healthy }
    command: [ "yarn", "worker:prod" ]
    networks: [ crm-network ]
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }
  crm-frontend:
    build:
      context: .
      dockerfile: docker/crm/Dockerfile
    restart: always
    env_file: [ .env ]
    ports:
      - "${INTERNAL_BIND_ADDR:-127.0.0.1}:${CRM_FRONTEND_PORT:-3001}:80"
    depends_on:
      - twenty-server
    networks: [ crm-network ]
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }

networks:
  crm-network:
    name: creatorflow-network

volumes:
  twenty_pg_data:
    name: telethon-crm_twenty_pg_data
    external: true
  twenty_redis_data:
    name: telethon-crm_twenty_redis_data
    external: true
  twenty_storage_data:
    name: telethon-crm_twenty_storage_data
    external: true
